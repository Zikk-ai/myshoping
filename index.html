<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Love</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: url('./aibar.jpeg') no-repeat center center;
  background-size: cover;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial;
  overflow: hidden;
}

/* затемнение */
body::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 1;
}

/* падающие сердечки */
.fall-heart {
  position: fixed;
  top: -50px;
  color: red;
  font-size: 18px;
  animation: fall linear infinite;
  z-index: 2;
  pointer-events: none;
}

@keyframes fall {
  from { transform: translateY(-50px); opacity: 1; }
  to { transform: translateY(110vh); opacity: 0; }
}

/* контейнер */
.container {
  position: relative;
  z-index: 3;
  text-align: center;
  transition: 0.5s;
}

/* размытие */
.container.blur {
  filter: blur(6px);
}

/* сердце */
.heart {
  width: 500px;
  height: 500px;
  cursor: pointer;
  animation: beat 1.2s infinite;
  overflow: visible; /* ⭐ ВАЖНО */
}

/* биение сердца */
@keyframes beat {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

/* линия сердца */
.heart path {
  fill: none;
  stroke: #ff0033;
  stroke-width: 5;
  stroke-linecap: round;

  stroke-dasharray: 1000;
  stroke-dashoffset: 1000;

  filter: drop-shadow(0 0 10px #ff0033);

  animation: draw 4s linear infinite, glow 1.5s ease-in-out infinite alternate;
}

@keyframes draw {
  to { stroke-dashoffset: 0; }
}

@keyframes glow {
  from { filter: drop-shadow(0 0 5px #ff0033); }
  to { filter: drop-shadow(0 0 25px #ff0033); }
}

/* буква */
.letter-b {
  position: absolute;
  top: 50%;
  left: 50%;
  right: 50%;
  transform: translate(-50%, -50%);
  font-size: 120px;
  color: white;
  font-weight: bold;
  text-shadow: 0 0 30px red;
  pointer-events: none;
}

/* overlay */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  opacity: 0;
  pointer-events: none;
  transition: 0.5s;
  z-index: 5;
}

.overlay.active {
  opacity: 1;
  pointer-events: all;
}

/* письмо */
.message {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  width: 380px;
  padding: 25px;
  background: white;
  color: black;
  border-radius: 20px;
  transition: 0.5s;
  z-index: 6;
  line-height: 1.5;
  cursor: pointer;
}

.message.active {
  transform: translate(-50%, -50%) scale(1);
}
</style>
</head>

<body>

<audio id="music" src="love.mp3"></audio>

<div class="overlay" id="overlay"></div>

<div class="container" id="container">

  <svg class="heart" viewBox="0 0 512 512" onclick="openMessage()">
    <path d="M256 464s-176-112-176-240c0-66 54-120 120-120 48 0 88 28 104 68 16-40 56-68 104-68 66 0 120 54 120 120 0 128-176 240-176 240z"/>
  </svg>


  <div class="letter-b">Б</div>

</div>

<div class="message" id="message">
  ❤️ С Днём Козы Көрпеш — Баян Сұлу ❤️<br><br>
  Ты для меня не просто человек…<br>
  Ты — тот, о ком я думаю каждый день.<br><br>
  С тобой даже обычные моменты становятся особенными.<br><br>
  Ты очень важна для меня ❤️
</div>

<script>
// открыть письмо
function openMessage() {
  document.getElementById("message").classList.add("active");
  document.getElementById("overlay").classList.add("active");
  document.getElementById("container").classList.add("blur");

  // музыка
  document.getElementById("music").play();
}

// закрытие
document.getElementById("overlay").onclick = closeAll;
document.getElementById("message").onclick = closeAll;

function closeAll() {
  document.getElementById("message").classList.remove("active");
  document.getElementById("overlay").classList.remove("active");
  document.getElementById("container").classList.remove("blur");
}

// падающие сердечки
function createHeart() {
  const heart = document.createElement("div");
  heart.classList.add("fall-heart");
  heart.innerHTML = "❤";

  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = (2 + Math.random() * 3) + "s";

  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 5000);
}

setInterval(createHeart, 300);
</script>

</body>
</html>
